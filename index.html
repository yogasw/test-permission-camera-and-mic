<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Camera & Microphone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 101, 101, 0.4);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            aspect-ratio: 16/9;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .status.info {
            background: #bee3f8;
            color: #2c5282;
            border-left: 4px solid #3182ce;
        }

        .status.success {
            background: #c6f6d5;
            color: #22543d;
            border-left: 4px solid #38a169;
        }

        .status.error {
            background: #fed7d7;
            color: #742a2a;
            border-left: 4px solid #e53e3e;
        }

        .status.warning {
            background: #feebc8;
            color: #7c2d12;
            border-left: 4px solid #dd6b20;
        }

        .error-details {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .audio-visualizer {
            background: #f7fafc;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .volume-bar {
            height: 30px;
            background: #e2e8f0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .volume-level {
            height: 100%;
            background: linear-gradient(90deg, #48bb78, #38a169);
            width: 0%;
            transition: width 0.1s ease;
            border-radius: 15px;
        }

        .device-info {
            background: #f7fafc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .device-info h3 {
            margin-bottom: 10px;
            color: #2d3748;
            font-size: 18px;
        }

        .device-item {
            padding: 8px;
            margin: 5px 0;
            background: white;
            border-radius: 4px;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        .badge.camera {
            background: #bee3f8;
            color: #2c5282;
        }

        .badge.mic {
            background: #fbb6ce;
            color: #702459;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 Test Camera & Microphone 🎤</h1>

        <div id="statusMessage" class="status info">
            Klik tombol di bawah untuk memulai test
        </div>

        <div class="button-group">
            <button id="startBtn" class="btn-primary" onclick="startMedia()">
                🚀 Start Camera & Mic
            </button>
            <button id="stopBtn" class="btn-danger" onclick="stopMedia()" disabled>
                🛑 Stop
            </button>
            <button id="testAudioBtn" class="btn-success" onclick="testAudio()" disabled>
                🔊 Test Audio
            </button>
        </div>

        <div class="video-container">
            <video id="videoElement" autoplay muted playsinline></video>
        </div>

        <div class="audio-visualizer hidden" id="audioVisualizer">
            <h3>📊 Audio Level</h3>
            <div class="volume-bar">
                <div id="volumeLevel" class="volume-level"></div>
            </div>
        </div>

        <div class="device-info hidden" id="deviceInfo">
            <h3>📱 Device Information</h3>
            <div id="deviceList"></div>
        </div>
    </div>

    <script>
        let mediaStream = null;
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let animationId = null;

        // Fungsi untuk menampilkan status
        function showStatus(message, type = 'info', errorDetails = null) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = message;
            
            if (errorDetails) {
                statusDiv.innerHTML += `<div class="error-details">${errorDetails}</div>`;
            }
        }

        // Fungsi untuk mendapatkan error message yang user-friendly
        function getErrorMessage(error) {
            let message = '';
            let details = '';

            switch(error.name) {
                case 'NotAllowedError':
                case 'PermissionDeniedError':
                    message = '❌ Permission Ditolak!';
                    details = 'Kamu menolak akses ke camera atau microphone. Silakan:
1. Klik ikon gembok/info di address bar
2. Izinkan akses camera dan microphone
3. Refresh halaman dan coba lagi';
                    break;
                
                case 'NotFoundError':
                case 'DevicesNotFoundError':
                    message = '❌ Device Tidak Ditemukan!';
                    details = 'Camera atau microphone tidak terdeteksi. Pastikan:
1. Device terpasang dengan benar
2. Driver sudah terinstall
3. Tidak digunakan aplikasi lain';
                    break;
                
                case 'NotReadableError':
                case 'TrackStartError':
                    message = '❌ Device Sedang Digunakan!';
                    details = 'Camera atau microphone sedang digunakan aplikasi lain. Tutup aplikasi yang menggunakan camera/mic dan coba lagi.';
                    break;
                
                case 'OverconstrainedError':
                    message = '❌ Constraint Tidak Didukung!';
                    details = 'Pengaturan yang diminta tidak didukung oleh device kamu.';
                    break;
                
                case 'TypeError':
                    message = '❌ Browser Tidak Mendukung!';
                    details = 'Browser kamu tidak mendukung getUserMedia. Gunakan browser modern seperti Chrome, Firefox, atau Edge.';
                    break;
                
                case 'AbortError':
                    message = '❌ Request Dibatalkan!';
                    details = 'Permintaan akses dibatalkan. Silakan coba lagi.';
                    break;
                
                default:
                    message = '❌ Error Tidak Dikenal!';
                    details = `Error: ${error.name}
Message: ${error.message}`;
            }

            return { message, details };
        }

        // Fungsi untuk start camera dan microphone
        async function startMedia() {
            try {
                showStatus('⏳ Meminta akses camera dan microphone...', 'info');

                // Check browser support
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new TypeError('getUserMedia tidak didukung');
                }

                // Request permission untuk camera dan microphone
                const constraints = {
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);

                // Display video
                const video = document.getElementById('videoElement');
                video.srcObject = mediaStream;

                // Setup audio context untuk visualizer
                setupAudioVisualizer();

                // Show device info
                await showDeviceInfo();

                // Update UI
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('testAudioBtn').disabled = false;
                document.getElementById('audioVisualizer').classList.remove('hidden');
                document.getElementById('deviceInfo').classList.remove('hidden');

                showStatus('✅ Camera dan Microphone Berhasil Diakses!', 'success');

            } catch (error) {
                console.error('Error accessing media devices:', error);
                const { message, details } = getErrorMessage(error);
                showStatus(message, 'error', details);
            }
        }

        // Setup audio visualizer
        function setupAudioVisualizer() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(mediaStream);
                
                analyser.fftSize = 256;
                microphone.connect(analyser);

                // Start animation
                visualizeAudio();
            } catch (error) {
                console.error('Error setting up audio visualizer:', error);
            }
        }

        // Visualize audio level
        function visualizeAudio() {
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            function draw() {
                animationId = requestAnimationFrame(draw);
                
                analyser.getByteFrequencyData(dataArray);
                
                // Calculate average volume
                const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
                const volumePercent = (average / 255) * 100;
                
                // Update volume bar
                document.getElementById('volumeLevel').style.width = volumePercent + '%';
            }
            
            draw();
        }

        // Test audio dengan beep sound
        function testAudio() {
            if (!audioContext) return;

            showStatus('🔊 Testing audio... Kamu harus dengar bunyi beep!', 'info');

            // Create oscillator untuk beep sound
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800; // Hz
            gainNode.gain.value = 0.3;

            oscillator.start();
            
            // Stop after 0.2 seconds
            setTimeout(() => {
                oscillator.stop();
                showStatus('✅ Audio test selesai! Kalau kamu dengar beep, audio berfungsi dengan baik!', 'success');
            }, 200);
        }

        // Show device information
        async function showDeviceInfo() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const deviceList = document.getElementById('deviceList');
                deviceList.innerHTML = '';

                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                const audioDevices = devices.filter(device => device.kind === 'audioinput');

                deviceList.innerHTML += '<strong>📹 Camera:</strong>';
                videoDevices.forEach((device, index) => {
                    deviceList.innerHTML += `
                        <div class="device-item">
                            ${index + 1}. ${device.label || `Camera ${index + 1}`}
                            <span class="badge camera">VIDEO</span>
                        </div>
                    `;
                });

                deviceList.innerHTML += '<strong style="display:block; margin-top:10px">🎤 Microphone:</strong>';
                audioDevices.forEach((device, index) => {
                    deviceList.innerHTML += `
                        <div class="device-item">
                            ${index + 1}. ${device.label || `Microphone ${index + 1}`}
                            <span class="badge mic">AUDIO</span>
                        </div>
                    `;
                });

            } catch (error) {
                console.error('Error enumerating devices:', error);
            }
        }

        // Stop media
        function stopMedia() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }

            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            const video = document.getElementById('videoElement');
            video.srcObject = null;

            // Update UI
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('testAudioBtn').disabled = true;
            document.getElementById('audioVisualizer').classList.add('hidden');
            document.getElementById('deviceInfo').classList.add('hidden');
            document.getElementById('volumeLevel').style.width = '0%';

            showStatus('⏹️ Camera dan Microphone dihentikan', 'warning');
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopMedia();
        });
    </script>
</body>
</html>
